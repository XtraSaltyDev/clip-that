name: Windows Candidate Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/windows-initial-build

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source gates
        run: npm run build

      - name: Package unsigned Windows x64 candidate
        run: npx electron-builder --win --x64 --publish never

      - name: Verify package contents and write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version").Trim()
          $artifacts = @(
            "dist/ClipThat-$version-x64-setup.exe",
            "dist/ClipThat-$version-x64-portable.exe",
            "dist/ClipThat-$version-x64.zip"
          )

          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Missing Windows candidate artifact: $artifact"
            }
          }

          $extractDir = Join-Path $env:RUNNER_TEMP ("clipthat-windows-$version")
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          try {
            Expand-Archive -LiteralPath $artifacts[2] -DestinationPath $extractDir -Force

            $packedExecutable = Get-ChildItem -Path $extractDir -Filter 'ClipThat.exe' -File -Recurse |
              Select-Object -First 1
            if ($null -eq $packedExecutable) {
              throw "$($artifacts[2]) does not contain ClipThat.exe"
            }

            $forbiddenFiles = Get-ChildItem -Path $extractDir -File -Force -Recurse |
              Where-Object {
                $_.Name -eq '.env' -or
                $_.Name -like '.env.*' -or
                $_.FullName -match '@ffmpeg-installer' -or
                $_.Name -eq 'ffmpeg.exe'
              }
            if (@($forbiddenFiles).Count -ne 0) {
              throw "$($artifacts[2]) contains a forbidden environment file or unaudited FFmpeg binary"
            }

            node scripts/verify-package-secrets.mjs $extractDir
            if ($LASTEXITCODE -ne 0) {
              throw 'Windows candidate package credential scan failed'
            }

            $resourcesPath = Join-Path $packedExecutable.DirectoryName 'resources'
            node scripts/verify-ocr-assets.mjs --package $resourcesPath
            if ($LASTEXITCODE -ne 0) {
              throw 'Windows candidate OCR provenance verification failed'
            }
          } finally {
            if (Test-Path -LiteralPath $extractDir) {
              Remove-Item -LiteralPath $extractDir -Recurse -Force
            }
          }

          $checksumPath = "dist/ClipThat-$version-windows-SHA256SUMS.txt"
          $checksums = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $artifact
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($artifact))"
          }
          Set-Content -LiteralPath $checksumPath -Value $checksums -Encoding ascii
          Write-Host "Verified unsigned Windows x64 candidate contains no unaudited FFmpeg package"

      - name: Upload Windows candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipThat-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ClipThat-*-x64-setup.exe
            dist/ClipThat-*-x64-portable.exe
            dist/ClipThat-*-x64.zip
            dist/ClipThat-*-windows-SHA256SUMS.txt
