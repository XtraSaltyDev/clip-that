name: macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the leading v
        required: true
        type: string
      publish:
        description: Publish immediately instead of creating a draft release
        required: true
        default: false
        type: boolean

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        id: release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "package.json is version $version, not $EXPECTED_VERSION." >&2
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Git tag $tag already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, sign, notarize, and verify
        run: npm run release:mac
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.publish && '--publish' || '--draft' }}
        run: npm run release:publish:mac -- "$RELEASE_MODE"
