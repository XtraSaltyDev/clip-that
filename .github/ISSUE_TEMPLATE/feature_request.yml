name: Feature request
description: Describe a workflow ClipThat could improve and the result you need.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Early ideas and usage questions can go in
        [Discussions](https://github.com/XtraSaltyDev/clip-that/discussions).
        ClipThat focuses on local capture, editable annotations, recording, and offline OCR/search.
        A proposal does not guarantee implementation or a release date.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the real workflow and where ClipThat gets in the way. Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
      description: Explain the behavior you need. Include an alternative or workaround if there is one.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and ClipThat version (optional)
      description: macOS on Apple silicon is supported; Windows x64 is experimental and Linux runtime support is unverified.
  - type: textarea
    id: constraints
    attributes:
      label: Privacy, data, or compatibility considerations (optional)
      description: Mention any network service, new permission, original capture data, editable project, or import/export requirement involved.
