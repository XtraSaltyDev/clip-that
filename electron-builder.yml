appId: dev.clipthat.app
productName: ClipThat
copyright: Copyright © 2026 ClipThat
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asarUnpack:
  - '**/node_modules/@ffmpeg-installer/**'

# Tray icons are loaded from disk at runtime, so they must sit outside the asar.
extraResources:
  - from: build
    to: build
    filter:
      - '*.png'
      - 'clipthat-window-info'
  # electron-builder only generates this for archive/installer targets. Shipping the
  # same fixed config explicitly keeps `npm run install:mac` representative too.
  - from: build/app-update.yml
    to: app-update.yml

extraMetadata:
  main: out/main/index.js

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  darkModeSupport: true
  hardenedRuntime: true
  notarize: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: ClipThat uses your camera for webcam overlays in screen recordings.
    NSMicrophoneUsageDescription: ClipThat uses your microphone to record narration.
    NSScreenCaptureUsageDescription: ClipThat needs screen recording access to capture screenshots and video.
    LSUIElement: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: nsis
      # The bundled recorder encoder currently has an x64 Windows build. Windows 11 on
      # ARM can run this package through x64 emulation; a native ARM64 artifact would
      # silently lose MP4/GIF export, so it is intentionally not advertised yet.
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClipThat

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Graphics
  synopsis: Screen capture, annotation and recording
  desktop:
    entry:
      Name: ClipThat
      Categories: Graphics;Utility;

publish:
  - provider: generic
    url: https://github.com/XtraSaltyDev/clip-that/releases
    # GitHub.supports normal byte ranges. Separate requests are easier to audit and
    # avoid multipart-range proxy differences on the private channel.
    useMultipleRangeRequest: false
