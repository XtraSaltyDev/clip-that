appId: dev.clipthat.app
productName: ClipThat
copyright: Copyright © 2026 ClipThat
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# Tray icons are loaded from disk at runtime, so they must sit outside the asar.
extraResources:
  - from: build
    to: build
    filter:
      - '*.png'
      - 'clipthat-window-info'
  # Directory builds do not generate updater metadata. Keep local installs and release
  # packages on the same public GitHub channel.
  - from: build/app-update.yml
    to: app-update.yml
  - from: third_party/ocr
    to: third-party/ocr
  - from: third_party/js
    to: third-party/js
  - from: THIRD_PARTY_NOTICES.md
    to: third-party/THIRD_PARTY_NOTICES.md

extraMetadata:
  main: out/main/index.js

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  darkModeSupport: true
  hardenedRuntime: true
  notarize: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: build/vendor/ffmpeg/package
      to: third-party/ffmpeg
  extendInfo:
    NSCameraUsageDescription: ClipThat uses your camera for webcam overlays in screen recordings.
    NSMicrophoneUsageDescription: ClipThat uses your microphone to record narration.
    NSAudioCaptureUsageDescription: ClipThat records system audio when you enable it for a screen recording.
    NSScreenCaptureUsageDescription: ClipThat needs screen recording access to capture screenshots and video.
    LSUIElement: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: nsis
      # Windows packages are unsupported candidates and deliberately contain no bundled
      # FFmpeg. Keep the candidate matrix narrow until a compliant media toolchain and
      # real-hardware acceptance exist.
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClipThat

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Graphics
  synopsis: Screen capture, annotation and recording
  desktop:
    entry:
      Name: ClipThat
      Categories: Graphics;Utility;

publish:
  - provider: github
    owner: XtraSaltyDev
    repo: clip-that
